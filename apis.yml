aid: abblix
name: Abblix
description: 'Abblix builds identity infrastructure for .NET: Abblix OIDC Server, an OpenID Foundation certified OpenID Connect / OAuth 2.0 server library distributed on NuGet and deployed inside the customer''s
  own perimeter, and Abblix Account, a free hosted authentication service (passkeys, MFA) whose OpenID Provider publishes discovery metadata at account.abblix.com. Licensing is tiered Community (free),
  Pro and Enterprise, priced by company size.'
